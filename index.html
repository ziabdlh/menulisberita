    <style>
      body {
        box-sizing: border-box;
      }

      .gradient-bg {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .card {
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      }

      .pulse-animation {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.8;
        }
      }

      .hover-scale {
        transition: transform 0.3s ease;
      }

      .hover-scale:hover {
        transform: scale(1.05);
      }
    </style>
    <style>
      @view-transition {
        navigation: auto;
      }
    </style>

    <script>
      const defaultConfig = {
        main_title: "Tugas Menulis Teks Berita",
        subtitle: "Kerjakan soal dengan mengklik tombol di bawah ini",
        instruction_text:
          "Silakan klik tombol di bawah untuk membuka formulir dan mengerjakan tugas menulis teks berita. Pastikan Anda mengisi semua pertanyaan dengan teliti.",
        button_text: "Kerjakan Soal Sekarang",
        background_color: "#667eea",
        card_color: "#ffffff",
        text_color: "#1f2937",
        button_color: "#7c3aed",
        accent_color: "#6366f1",
      };

      async function onConfigChange(config) {
        const mainTitle = config.main_title || defaultConfig.main_title;
        const subtitle = config.subtitle || defaultConfig.subtitle;
        const instructionText =
          config.instruction_text || defaultConfig.instruction_text;
        const buttonText = config.button_text || defaultConfig.button_text;
        const backgroundColor =
          config.background_color || defaultConfig.background_color;
        const cardColor = config.card_color || defaultConfig.card_color;
        const textColor = config.text_color || defaultConfig.text_color;
        const buttonColor = config.button_color || defaultConfig.button_color;
        const accentColor = config.accent_color || defaultConfig.accent_color;

        document.getElementById("main-title").textContent = mainTitle;
        document.getElementById("subtitle").textContent = subtitle;
        document.getElementById("instruction-text").textContent =
          instructionText;
        document.getElementById("button-text").innerHTML = `
        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        ${buttonText}
      `;

        const gradientBg = document.querySelector(".gradient-bg");
        gradientBg.style.background = `linear-gradient(135deg, ${backgroundColor} 0%, ${accentColor} 100%)`;

        const card = document.querySelector(".card");
        card.style.backgroundColor = cardColor;

        const titleElement = document.getElementById("main-title");
        titleElement.style.color = textColor;

        const formLink = document.getElementById("form-link");
        formLink.style.background = `linear-gradient(to right, ${buttonColor}, ${accentColor})`;
      }

      function mapToCapabilities(config) {
        return {
          recolorables: [
            {
              get: () =>
                config.background_color || defaultConfig.background_color,
              set: (value) => {
                if (window.elementSdk) {
                  window.elementSdk.setConfig({ background_color: value });
                }
              },
            },
            {
              get: () => config.card_color || defaultConfig.card_color,
              set: (value) => {
                if (window.elementSdk) {
                  window.elementSdk.setConfig({ card_color: value });
                }
              },
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                if (window.elementSdk) {
                  window.elementSdk.setConfig({ text_color: value });
                }
              },
            },
            {
              get: () => config.button_color || defaultConfig.button_color,
              set: (value) => {
                if (window.elementSdk) {
                  window.elementSdk.setConfig({ button_color: value });
                }
              },
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (value) => {
                if (window.elementSdk) {
                  window.elementSdk.setConfig({ accent_color: value });
                }
              },
            },
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined,
        };
      }

      function mapToEditPanelValues(config) {
        return new Map([
          ["main_title", config.main_title || defaultConfig.main_title],
          ["subtitle", config.subtitle || defaultConfig.subtitle],
          [
            "instruction_text",
            config.instruction_text || defaultConfig.instruction_text,
          ],
          ["button_text", config.button_text || defaultConfig.button_text],
        ]);
      }

      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities,
          mapToEditPanelValues,
        });
      }
    </script>
